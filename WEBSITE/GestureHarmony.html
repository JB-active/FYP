
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GestureHarmony MVP</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <h1>GestureHarmony Test Build</h1>
        
        <div class="controls">
            <label for="keySelect">Musical Key: </label>
            <select id="keySelect">
                <option value="C">C Major</option>
                <option value="G">G Major</option>
                <option value="D">D Major</option>
            </select>
            <button id="startBtn">Enable Camera & Audio</button>
        </div>

        <div class="video_feed">
            [ Webcam Video Feed Placeholder ]
        </div>

        <div class="output_box">
            <strong>Fingers Detected:</strong> <span id="fingerCount">0</span>
        </div>

        <div class="output_box">
            <strong>Active Chord (NNS):</strong> <span id="chordOutput">None</span>
        </div>
    </div>

    <div class="controls">
        <h3>Progression Playback</h3>

        <div>
            <label for="progressionInput">Type the Progression: </label>
            <input type="text" id="progressionInput" placeholder="e.g., 6 4 1 5">
        </div>

        <div>
            <label for="bpmInput">Tempo (BPM): </label>
            <input type="number" id="bpmInput" value="120" min="40" max="240"> /* Setting a default BPM value, minimum and maximum values for the bpm value*/

            <label for="timeSigSelect">Time Signature: </label>
            <select id="timeSigSelect">
                <option value="4/4">4/4</option>
                <option value="3/4">3/4</option>
                <option value="6/8">6/8</option>
            </select>
        </div>

        <div>
            <button id="playProgressionBtn">Play Progression</button>
            <button id="stopProgressionBtn">Stop Progression</button>
    </div>

</body>
</html>
