
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GestureHarmony MVP</title>
    <style>
        /* Intentionally bland CSS with zero aesthetic polish so that it can be later improved*/
        body {
            font-family: "Times New Roman", Times, serif; 
            background-color: #ffffff;
            color: #000000;
            padding: 20px;
        }
        .container {
            border: 2px solid #000;
            width: 600px;
            padding: 10px;
        }
        .controls {
            margin-bottom: 20px;
        }
        .video-feed {
            width: 480px;
            height: 360px;
            background-color: #cccccc; /*  gray placeholder */
            border: 1px solid #333;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 20px;
        }
        .output-box {
            border: 1px dashed #666;
            padding: 10px;
            margin-bottom: 10px;
            font-size: 18px;
        }
        button {
            padding: 5px 10px;
            font-size: 16px;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>GestureHarmony Test Build</h1>
        
        <div class="controls">
            <label for="keySelect">Musical Key: </label>
            <select id="keySelect">
                <option value="C">C Major</option>
                <option value="G">G Major</option>
                <option value="D">D Major</option>
            </select>
            <button id="startBtn">Enable Camera & Audio</button>
        </div>

        <div class="video-feed">
            [ Webcam Video Feed Placeholder ]
        </div>

        <div class="output-box">
            <strong>Fingers Detected:</strong> <span id="fingerCount">0</span>
        </div>

        <div class="output-box">
            <strong>Active Chord (NNS):</strong> <span id="chordOutput">None</span>
        </div>
    </div>

</body>
</html>
